name: EAG Manual Pages Publication

on:
  workflow_dispatch:
    inputs:
      action:
        description: Separate manual release or recovery
        required: true
        type: choice
        options: [release, recover]
      approval_json:
        description: Explicit approved JSON record; the DRAFT template is rejected
        required: true
        type: string
      confirmation:
        description: DEPLOY <targetSHA> or RECOVER <targetSHA> <archiveSHA256>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RELEASE_ACTION: ${{ inputs.action }}
  APPROVAL_JSON: ${{ inputs.approval_json }}
  CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  release_prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Only release preparation may create an archive Release.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Authenticate manual approval and exact main CI artifact
        id: origin
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/pages-release-actions.cjs').authenticate({github, context, core})
      - name: Download only the approved immutable artifact ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.origin.outputs.artifact_id }}
          run-id: ${{ steps.origin.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: output/candidate
          merge-multiple: true
      - name: Verify candidate and create package without rebuilding
        run: |
          npm run candidate:verify -- --root output/candidate
          npm run package:create -- --input output/candidate --output output/publish-ready
          npm run package:verify -- --root output/publish-ready
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.origin.outputs.sha }}
          CANDIDATE_RUN_ID: ${{ steps.origin.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.origin.outputs.run_attempt }}
          CANDIDATE_EVENT: push
          CANDIDATE_REF: refs/heads/main
      - name: Save Release archive, retrieve it, verify package and conditional gate
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/pages-release-actions.cjs').archiveRelease({github, context, core})
      - name: Preserve exact archive and checksum for local custody
        uses: actions/upload-artifact@v4
        with:
          name: eag-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/handoff
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  recovery_prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Authenticate separate recovery approval and original main CI
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/pages-release-actions.cjs').authenticate({github, context, core})
      - name: Retrieve only the approved existing archive and verify recovery gate
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/pages-release-actions.cjs').prepareRecovery({github, context})
      - uses: actions/upload-artifact@v4
        with:
          name: eag-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/handoff
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  release_deploy:
    needs: release_prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'release' && needs.release_prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: eag-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/handoff
      - name: Reauthenticate, retrieve fixed archive and reverify package before release
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/pages-release-actions.cjs').verifyForDeploy({github, context, core})
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/publish
      - name: Deploy only the approved release
        id: deployment
        uses: actions/deploy-pages@v4

  recovery_deploy:
    needs: recovery_prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'recover' && needs.recovery_prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: eag-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/handoff
      - name: Reauthenticate and reverify the separately approved recovery archive
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/pages-release-actions.cjs').verifyForDeploy({github, context, core})
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/publish
      - name: Deploy only the approved recovery
        id: deployment
        uses: actions/deploy-pages@v4
